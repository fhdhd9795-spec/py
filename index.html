<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineral Master · Key Panel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 텍스트 선택 방지 */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    :root {
      --teal:    #00e5c8;
      --teal-dim:#00a896;
      --bg:      #060a12;
      --card:    #0c1220;
      --card2:   #101828;
      --border:  #0f2a28;
      --text:    #c8e6e2;
      --muted:   #4a7a74;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 배경 그리드 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
    }

    /* 중앙 글로우 */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0,229,200,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .panel {
      position: relative;
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid rgba(0,229,200,0.18);
      border-radius: 20px;
      padding: 36px 32px 28px;
      box-shadow: 0 0 60px rgba(0,229,200,0.07), 0 24px 48px rgba(0,0,0,0.5);
      animation: rise 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }

    /* 상단 라인 장식 */
    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 32px; right: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
    }

    /* 아이콘 뱃지 */
    .badge {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(0,229,200,0.15), rgba(0,168,150,0.05));
      border: 1px solid rgba(0,229,200,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* 비번 박스 */
    .key-wrap {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 14px;
    }

    .key-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal-dim);
      margin-bottom: 10px;
    }

    .key-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 2px;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: break-all;
    }

    .key-value.loading {
      color: var(--muted);
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .key-value.error {
      color: #ff6060;
      font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* 점 깜빡이기 */
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* 복사 버튼 */
    .copy-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--teal), #00b8a0);
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .copy-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .copy-btn:hover::before { opacity: 1; }
    .copy-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,229,200,0.3); }
    .copy-btn:active { transform: translateY(0); }

    .copy-btn.copied {
      background: linear-gradient(135deg, #00d46e, #00a855);
    }

    /* 새로고침 버튼 */
    .refresh-btn {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: var(--teal-dim);
      color: var(--teal);
    }

    /* 하단 정보 */
    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .source-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      transition: color 0.2s;
    }

    .source-link:hover { color: var(--teal); }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
      display: inline-block;
      margin-right: 6px;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(135deg, #00d46e, #00a855);
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 100px;
      box-shadow: 0 8px 24px rgba(0,212,110,0.4);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      z-index: 99;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="badge">🔑</div>
    <h1>Mineral Master</h1>
    <p class="subtitle">오늘의 접속 키를 복사하세요</p>

    <div class="key-wrap">
      <div class="key-label">ACCESS KEY</div>
      <div class="key-value loading" id="keyDisplay">불러오는 중...</div>
    </div>

    <button class="copy-btn" id="copyBtn" disabled onclick="copyKey()">
      복사하기
    </button>
  </div>

  <div class="toast" id="toast">✅ 복사됐습니다!</div>

  <script>
    // ============================
    // 🔒 보안 시스템
    // ============================
    const MAX_WARN   = 5;
    const BAN_DAYS   = 10;
    const WARN_KEY   = "mm_warnings";
    const BAN_KEY    = "mm_ban_until";

    // ── 차단 확인 (페이지 로드 시)
    function checkBan() {
      const banUntil = localStorage.getItem(BAN_KEY);
      if (banUntil && Date.now() < parseInt(banUntil)) {
        const days = Math.ceil((parseInt(banUntil) - Date.now()) / 86400000);
        showBanScreen(days);
        return true;
      }
      return false;
    }

    // ── 차단 화면
    function showBanScreen(daysLeft) {
      document.body.innerHTML = `
        <div style="
          min-height:100vh; display:flex; align-items:center; justify-content:center;
          background:#04060c; font-family:'Space Grotesk',sans-serif;
          flex-direction:column; gap:20px; text-align:center; padding:24px;
        ">
          <div style="font-size:56px;">🚫</div>
          <div style="font-size:22px; font-weight:700; color:#ff4444;">접근 차단됨</div>
          <div style="
            background:#130a0a; border:1px solid #3a0a0a; border-radius:14px;
            padding:20px 28px; max-width:340px; color:#cc4444; font-size:14px; line-height:1.7;
          ">
            보안 정책 위반으로 인해<br>
            이 사이트에 <strong>${daysLeft}일간</strong> 접근이 차단됐습니다.<br><br>
            <span style="color:#884444; font-size:12px;">개발자도구 · 소스 보기 · 페이지 저장 감지</span>
          </div>
        </div>`;
    }

    // ── 경고 카운트 증가 + 경고창 표시
    function recordViolation(reason) {
      if (checkBan()) return;

      let count = parseInt(localStorage.getItem(WARN_KEY) || "0") + 1;
      localStorage.setItem(WARN_KEY, count);

      if (count >= MAX_WARN) {
        // 10일 차단
        const banUntil = Date.now() + BAN_DAYS * 86400000;
        localStorage.setItem(BAN_KEY, banUntil);
        localStorage.removeItem(WARN_KEY);
        showBanScreen(BAN_DAYS);
        return;
      }

      const left = MAX_WARN - count;
      showWarning(reason, count, left);
    }

    // ── 경고 모달
    let warnModal = null;
    function showWarning(reason, count, left) {
      if (warnModal) warnModal.remove();

      warnModal = document.createElement("div");
      warnModal.style.cssText = `
        position:fixed; inset:0; z-index:9999;
        display:flex; align-items:center; justify-content:center;
        background:rgba(0,0,0,0.85); backdrop-filter:blur(8px);
        font-family:'Space Grotesk',sans-serif;
        animation: fadeIn 0.2s ease;
      `;

      warnModal.innerHTML = `
        <style>@keyframes fadeIn{from{opacity:0}to{opacity:1}}</style>
        <div style="
          background:#0e0a0a; border:1px solid #5a1010; border-radius:18px;
          padding:32px 28px; max-width:340px; width:92%; text-align:center;
          box-shadow:0 0 60px rgba(255,40,40,0.2);
        ">
          <div style="font-size:44px; margin-bottom:14px;">⚠️</div>
          <div style="font-size:18px; font-weight:700; color:#ff4444; margin-bottom:8px;">
            보안 경고
          </div>
          <div style="
            background:#1a0808; border-radius:10px; padding:12px 16px;
            color:#ff6666; font-size:13px; margin-bottom:16px; line-height:1.6;
          ">
            <strong>${reason}</strong> 감지됨<br>
            <span style="color:#884444;">이 행위는 보안 정책을 위반합니다.</span>
          </div>
          <div style="
            font-size:13px; color:#cc4444; margin-bottom:20px;
          ">
            경고 <strong style="color:#ff4444; font-size:18px;">${count} / ${MAX_WARN}</strong><br>
            <span style="color:#884444; font-size:12px;">
              ${left > 0 ? `${left}번 더 위반 시 ${BAN_DAYS}일 차단됩니다` : `다음 위반 시 차단됩니다`}
            </span>
          </div>
          <button onclick="this.closest('div[style]').parentElement.remove()" style="
            width:100%; padding:12px; border:none; border-radius:10px;
            background:linear-gradient(135deg,#cc2222,#881111);
            color:#fff; font-family:'Space Grotesk',sans-serif;
            font-size:14px; font-weight:700; cursor:pointer;
          ">확인 (창 닫기)</button>
        </div>`;

      document.body.appendChild(warnModal);
    }

    // ── 우클릭 방지
    document.addEventListener("contextmenu", e => e.preventDefault());

    // ── 텍스트 선택 방지
    document.addEventListener("selectstart", e => e.preventDefault());

    // ── 키보드 단축키 방지 + 위반 감지
    document.addEventListener("keydown", e => {
      const key  = e.key.toLowerCase();
      const ctrl = e.ctrlKey || e.metaKey;

      // 소스 보기 (Ctrl+U)
      if (ctrl && key === "u") {
        e.preventDefault();
        recordViolation("소스 보기 (Ctrl+U)");
        return false;
      }
      // 페이지 저장 (Ctrl+S)
      if (ctrl && key === "s") {
        e.preventDefault();
        recordViolation("페이지 저장 (Ctrl+S)");
        return false;
      }
      // 전체 선택 (Ctrl+A)
      if (ctrl && key === "a") {
        e.preventDefault();
        return false;
      }
      // 개발자도구 단축키
      if (
        (ctrl && e.shiftKey && (key === "i" || key === "j" || key === "c")) ||
        e.key === "F12"
      ) {
        e.preventDefault();
        recordViolation("개발자도구 열기");
        return false;
      }
    });

    // ── 개발자도구 감지 (창 크기 방식)
    let devWarnCooldown = false;
    setInterval(() => {
      const w = window.outerWidth  - window.innerWidth  > 160;
      const h = window.outerHeight - window.innerHeight > 160;
      if ((w || h) && !devWarnCooldown) {
        devWarnCooldown = true;
        recordViolation("개발자도구 열기");
        // 내용 잠시 숨기기
        document.querySelector(".panel") && (document.querySelector(".panel").style.visibility = "hidden");
        setTimeout(() => {
          devWarnCooldown = false;
          const p = document.querySelector(".panel");
          if (p) p.style.visibility = "visible";
        }, 3000);
      }
    }, 800);

    // ── 페이지 로드 시 차단 확인
    if (checkBan()) {
      // 차단된 경우 아무것도 실행 안 함
    } else {

    const PW_URL = "https://raw.githubusercontent.com/fhdhd9795-spec/py/refs/heads/main/py";
    let currentKey = "";

    async function loadKey() {
      const display = document.getElementById("keyDisplay");
      const btn     = document.getElementById("copyBtn");

      display.className = "key-value loading";
      display.textContent = "불러오는 중...";
      btn.disabled = true;

      try {
        const res  = await fetch(PW_URL + "?t=" + Date.now()); // 캐시 방지
        const text = (await res.text()).trim();

        if (!text) throw new Error("empty");

        currentKey = text;
        display.className = "key-value";
        display.innerHTML = `<span class="dot"></span>${text}`;
        btn.disabled = false;

      } catch (e) {
        display.className = "key-value error";
        display.textContent = "⚠ 불러오기 실패 · 새로고침 해주세요";
        btn.disabled = true;
      }
    }

    function copyKey() {
      if (!currentKey) return;

      navigator.clipboard.writeText(currentKey).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "✓ 복사됐습니다!";
        btn.classList.add("copied");

        showToast();

        setTimeout(() => {
          btn.textContent = "복사하기";
          btn.classList.remove("copied");
        }, 2000);
      });
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // 페이지 로드 시 자동 실행
    loadKey();

    } // end if(!checkBan)
  </script>

</body>
</html>
