<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>ShadowX</title>

<style>

body{
background:black;
color:red;
font-family:Arial;
text-align:center;
padding-top:120px;
}

h1{
font-size:60px;
text-shadow:0 0 20px red;
}

#box{
margin:auto;
margin-top:40px;
width:400px;
padding:20px;
border:2px solid red;
border-radius:15px;
box-shadow:0 0 20px red;
background:#111;
}

#code{
font-size:28px;
color:white;
margin-top:20px;
word-break:break-all;
}

button{
margin-top:25px;
padding:12px 30px;
font-size:20px;
background:red;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<h1>ShadowX</h1>

<div id="box">

<p>Loading Key...</p>

<div id="code">...</div>

<button onclick="copyCode()">COPY</button>

</div>

<script>

let currentCode = "";

async function loadCode(){

const ref = document.referrer.toLowerCase();

if(
!ref.includes("linkvertise") &&
!ref.includes("link-hub.net")
){

window.location.replace("https://linkvertise.com");
return;

}

const res = await fetch(
"https://raw.githubusercontent.com/fhdhd9795-spec/py/main/password.txt"
);

currentCode = (await res.text()).trim();

document.getElementById("code").innerText = currentCode;

}

function copyCode(){

navigator.clipboard.writeText(currentCode);

alert("Copied!");

}

loadCode();

</script>

</body>
</html>
