name: 🔐 Daily Password Generator

on:
  schedule:
    # 매일 자정 KST (= 15:00 UTC)
    - cron: '0 15 * * *'

  # 수동 실행도 가능 (테스트용)
  workflow_dispatch:

jobs:
  update-password:
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 비번 생성 + 암호화 + 업로드
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python generate.py
